version: '3.8'
services:
  users:
    build: ./users
    networks:
      - gateway_net
  orders:
    build: ./orders
    networks:
      - gateway_net
  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    depends_on:
      - users
      - orders
    networks:
      - gateway_net

networks:
  gateway_net:
    driver: bridge
